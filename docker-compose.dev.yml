# Local Postgres for dev/test. Port 5439 avoids clashing with other projects.
services:
  postgres:
    image: postgres:16-alpine
    container_name: bullethub-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
