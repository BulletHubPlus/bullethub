version: 2
updates:
  - package-ecosystem: mix
    directory: /backend
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    cooldown:
      default-days: 7
