name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "27.3"

jobs:
  backend-test:
    name: Backend · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MIX_ENV: test
      DB_PORT: "5432"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            backend/deps
            backend/_build/test
          key: test-${{ runner.os }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: test-${{ runner.os }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors

  backend-quality:
    name: Backend · format, credo, sobelow, audit, dialyzer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            backend/deps
            backend/_build/dev
          key: dev-${{ runner.os }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: dev-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend/priv/plts
          key: plt-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: plt-${{ runner.os }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix sobelow --config --exit
      - run: mix deps.audit
      - run: mix hex.audit
      - run: mkdir -p priv/plts && mix dialyzer --format github

  frontend:
    name: Frontend · typecheck, test, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: E2E · Chromium, Firefox, WebKit
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    env:
      MIX_ENV: dev
      DB_PORT: "5432"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            backend/deps
            backend/_build/dev
          key: e2e-${{ runner.os }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: e2e-${{ runner.os }}-
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ./scripts/dev-sample-video.sh
      - name: Build SPA
        working-directory: frontend
        run: npm ci --no-fund && npm run build
      - name: Backend deps and admin assets
        working-directory: backend
        run: |
          mix deps.get
          mix assets.setup
          cd assets && npm ci --no-fund
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci --no-fund
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: semgrep scan --config auto --error

  image:
    name: Docker image + Trivy
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: bullethub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # pinned SHA, same as prostaff-api
        with:
          image-ref: bullethub:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
